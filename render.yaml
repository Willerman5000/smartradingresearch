services:
  - type: web
    name: research-execution
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 1 --worker-class gthread --timeout 300 --graceful-timeout 30 --max-requests 80 --max-requests-jitter 10
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RESEARCH_ENGINE
        value: execution
      - key: RESEARCH_AUTO_INTERVAL_MINUTES
        value: 120
      - key: RESEARCH_MEMORY_HARD_MB
        value: 350
      - key: CENTRAL_SUPABASE_URL
        sync: false
      - key: CENTRAL_SUPABASE_SERVICE_KEY
        sync: false
      - key: RESEARCH_RUN_TOKEN
        sync: false
      - key: RESEARCH_DASHBOARD_MAX_ROWS
        value: 120


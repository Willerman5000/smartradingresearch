services:
  - type: web
    name: research-execution
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 1 --worker-class gthread --timeout 600 --graceful-timeout 45
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RESEARCH_ENGINE
        value: execution
      - key: RESEARCH_AUTO_INTERVAL_MINUTES
        value: 120
      - key: RESEARCH_BOOT_DELAY_SECONDS
        value: 45
      - key: RESEARCH_MEMORY_HARD_MB
        value: 430
      - key: RESEARCH_CAUSAL_MEMORY_TARGET_MB
        value: 390
      - key: RESEARCH_CAUSAL_MAX_BARS
        value: 12000
      - key: RESEARCH_CAUSAL_CACHE_MB
        value: 270
      - key: CENTRAL_SUPABASE_URL
        sync: false
      - key: CENTRAL_SUPABASE_SERVICE_KEY
        sync: false
      - key: RESEARCH_RUN_TOKEN
        sync: false
      - key: RESEARCH_DASHBOARD_MAX_ROWS
        value: 180

